<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9" />
      <stop offset="100%" stop-color="#f5f2eb" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8bfae" />
      <stop offset="50%" stop-color="#9a8e7a" />
      <stop offset="100%" stop-color="#766b57" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" rx="8" />
  <rect x="0.5" y="0.5" width="399" height="299" fill="none" stroke="#e8e2d5" stroke-width="1" rx="8" />

  <!-- Subtle Diamond Wireframe / Facet Silhouette -->
  <g transform="translate(140, 55)" stroke="url(#gemGrad)" stroke-width="1.75" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Table and Crown -->
    <polygon points="32,25 88,25 110,55 10,55" fill="#fcfbfa" fill-opacity="0.8" />
    <!-- Pavilion to Culet -->
    <polygon points="10,55 110,55 60,115" fill="#f8f5ee" fill-opacity="0.8" />
    <!-- Facet Inner Lines -->
    <line x1="32" y1="25" x2="60" y2="55" />
    <line x1="88" y1="25" x2="60" y2="55" />
    <line x1="60" y1="55" x2="60" y2="115" />
    <line x1="32" y1="25" x2="10" y2="55" />
    <line x1="88" y1="25" x2="110" y2="55" />
    <line x1="10" y1="55" x2="60" y2="115" />
    <line x1="110" y1="55" x2="60" y2="115" />
    <!-- Internal Reflections -->
    <line x1="35" y1="55" x2="60" y2="115" stroke-opacity="0.4" stroke-dasharray="3,3" />
    <line x1="85" y1="55" x2="60" y2="115" stroke-opacity="0.4" stroke-dasharray="3,3" />
  </g>

  <!-- Clean, Truthful Labeling -->
  <text x="200" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7a7060" letter-spacing="0.14em">
    NO PHOTO AVAILABLE
  </text>
  <text x="200" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#a49a88" letter-spacing="0.08em">
    AUTHENTIC SPECIFICATION RECORD
  </text>
</svg>
